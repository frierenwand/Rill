name: Sync with upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'mrtxiv/Rill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pull upstream changes
        run: |
          git config user.name "rill-sync"
          git config user.email "rill-sync@users.noreply.github.com"
          git remote add upstream https://github.com/mrtxiv/Rill.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:${{ github.ref_name }}
